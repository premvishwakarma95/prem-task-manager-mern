server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API requests go to the server container; the browser only talks to this origin.
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
